name: CI

# Runs on everything that is NOT a deploy: pull requests and side branches.
# `main` is covered by deploy.yml, which runs the same checks before publishing.

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `tsc -b` (build mode) et non `tsc --noEmit` : le projet utilise des
      # project references (tsconfig.node.json, composite). --noEmit échoue
      # systématiquement sur runner frais (TS6305 : outputs composite absents).
      - run: npx tsc -b
      - run: npm test
