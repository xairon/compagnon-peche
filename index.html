<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <!-- Deux balises `media` : elles donnent la bonne barre d'état en mode auto
         AVANT que le moindre script ne tourne. Dès que le thème est résolu, le
         script ci-dessous (puis React) écrit la troisième, sans `media`, qui
         l'emporte. Les valeurs sont celles de THEME_COLORS dans lib/theme.ts —
         src/lib/theme-dom.test.ts fait échouer la suite si elles divergent. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#16281E" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D120F" />
    <meta name="theme-color" content="#16281E" />

    <!-- Anti-flash. Sans ce script, un utilisateur en thème sombre voit un
         flash blanc pleine page à chaque lancement, le temps que le bundle
         React se charge — sur une PWA lancée depuis l'écran d'accueil, c'est
         le défaut le plus visible de toute la fonctionnalité.

         C'est la forme minimale de lib/theme.ts, pas une seconde
         implémentation : même clé, même résolution, mêmes couleurs. Il ne peut
         pas importer le module (il doit être synchrone et précéder le bundle).
         Tout est enveloppé : un localStorage inaccessible en navigation privée
         fait lever l'ACCÈS lui-même, et l'app ne doit pas mourir pour ça. -->
    <script>
      (function () {
        var t = "auto";
        try {
          var p = JSON.parse(localStorage.getItem("carnet:prefs") || "{}");
          if (p.theme === "light" || p.theme === "dark" || p.theme === "auto") t = p.theme;
        } catch (e) {}
        var eff =
          t === "auto"
            ? (window.matchMedia &&
               window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light")
            : t;
        document.documentElement.setAttribute("data-theme", eff);
        var m = document.querySelector('meta[name="theme-color"]:not([media])');
        if (m) m.setAttribute("content", eff === "dark" ? "#0D120F" : "#16281E");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Compagnon de pêche eau douce — fiches espèces, réglementation, cuisine et gestes, hors-ligne."
    />
    <title>Compagnon de pêche</title>

    <!--
      Aperçu de lien. Sans ces balises, l'app partagée par WhatsApp entre
      pêcheurs s'affichait comme une URL nue — or ce partage est son seul canal
      de diffusion, faute d'être dans un store.

      Les URL sont ABSOLUES : aucune des messageries qui comptent ici ne résout
      un `og:image` relatif, et une vignette non résolue ne s'affiche pas du
      tout. L'adresse est celle du service, vérifiée le 31/07/2026 ; elle est
      dupliquée depuis src/data/mentions-legales.ts, et src/lib/manifest.test.ts
      fait échouer la suite si les deux divergent — le HTML statique ne peut pas
      importer la constante.

      La vignette est l'icône 512 px : c'est la seule image de l'app qui la
      représente, faute de capture d'écran produite (voir src/lib/manifest.ts).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Compagnon de pêche" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://xairon.github.io/compagnon-peche/" />
    <meta property="og:title" content="Compagnon de pêche — eau douce, hors-ligne" />
    <meta
      property="og:description"
      content="Fiches espèces, réglementation, cuisine et gestes de pêche en eau douce — hors-ligne."
    />
    <meta
      property="og:image"
      content="https://xairon.github.io/compagnon-peche/icon-512.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta
      property="og:image:alt"
      content="Icône du Compagnon de pêche"
    />

    <!-- `summary` et non `summary_large_image` : la vignette est une icône
         carrée de 512 px, pas une bannière. Annoncer une grande image pour
         servir un carré la fait recadrer ou rejeter. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Compagnon de pêche — eau douce, hors-ligne" />
    <meta
      name="twitter:description"
      content="Fiches espèces, réglementation, cuisine et gestes de pêche en eau douce — hors-ligne."
    />
    <meta
      name="twitter:image"
      content="https://xairon.github.io/compagnon-peche/icon-512.png"
    />
    <meta name="twitter:image:alt" content="Icône du Compagnon de pêche" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
